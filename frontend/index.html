<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroBin — Zero-Knowledge Encrypted Pastebin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://zerobin.cc/" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="ZeroBin is a zero-knowledge encrypted pastebin. Share text and files securely — data is encrypted in your browser, the server never sees your content." />
    <meta name="keywords" content="pastebin, encrypted, zero-knowledge, privacy, secure, paste, share, end-to-end encryption" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZeroBin — Zero-Knowledge Encrypted Pastebin" />
    <meta property="og:description" content="Share text and files securely. Data is encrypted in your browser — the server never sees your content." />
    <meta property="og:url" content="https://zerobin.cc/" />
    <meta property="og:site_name" content="ZeroBin" />
    <meta property="og:image" content="https://zerobin.cc/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZeroBin — Zero-Knowledge Encrypted Pastebin" />
    <meta name="twitter:description" content="Share text and files securely. Data is encrypted in your browser — the server never sees your content." />
    <meta name="twitter:image" content="https://zerobin.cc/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ZeroBin",
      "url": "https://zerobin.cc/",
      "description": "Zero-knowledge encrypted pastebin. Share text and files securely with end-to-end encryption.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "End-to-end encryption",
        "Zero-knowledge architecture",
        "Burn after reading",
        "Password protection",
        "File attachments",
        "Expiration control"
      ]
    }
    </script>
  </head>
  <body class="h-full bg-[#0a0a0f] text-gray-100 antialiased">
    <div id="app"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; color: #e2e8f0; font-family: system-ui, sans-serif;">
        <h1>ZeroBin</h1>
        <p>ZeroBin is a zero-knowledge encrypted pastebin that requires JavaScript to function.</p>
        <p>All encryption and decryption happens in your browser using AES-256-GCM. The server never sees your data.</p>
        <p>Please enable JavaScript to use ZeroBin.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
